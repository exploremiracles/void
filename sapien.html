<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Void | Audio Podcasts with Captions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        }

        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --primary-light: #818cf8;
            --secondary: #8b5cf6;
            --accent: #06b6d4;
            --text: #ffffff;
            --text-secondary: #a0aec0;
            --text-tertiary: #718096;
            --bg-primary: #000000;
            --bg-secondary: #0f172a;
            --bg-card: rgba(30, 41, 59, 0.7);
            --bg-hover: rgba(99, 102, 241, 0.1);
            --border: rgba(255, 255, 255, 0.1);
            --glass: blur(20px);
            --shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
            --gradient: linear-gradient(135deg, wheat, white);
            --gradient-dark: linear-gradient(135deg, var(--primary-dark), var(--secondary));
            --radius: 20px;
            --radius-sm: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

body {
    margin: 0;
    padding: 0;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    background: #000;
}

/* Video background */
.video-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
    pointer-events: none;
    filter:grayscale(100%);
    background: black;
}

/* Optional overlay for readability */
body::before {
    content: "";
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    z-index: -1;
}

        /* Background Particles */
        .particles-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            pointer-events: none;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--primary-light);
            border-radius: 50%;
            opacity: 0.3;
            animation: float 20s infinite linear;
        }

        @keyframes float {
            0% {
                transform: translateY(0) translateX(0);
                opacity: 0.3;
            }
            50% {
                transform: translateY(-100px) translateX(100px);
                opacity: 0.6;
            }
            100% {
                transform: translateY(0) translateX(0);
                opacity: 0.3;
            }
        }

        /* Gradient Orbs */
        .gradient-orbs {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            filter: blur(80px);
            opacity: 0.3;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at center, var(--primary) 0%, transparent 70%);
        }

        .orb-1 {
            width: 600px;
            height: 600px;
            top: -200px;
            right: -200px;
            animation: pulse 8s ease-in-out infinite;
        }

        .orb-2 {
            width: 400px;
            height: 400px;
            bottom: -100px;
            left: -100px;
            background: radial-gradient(circle at center, var(--accent) 0%, transparent 70%);
            animation: pulse 6s ease-in-out infinite reverse;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                opacity: 0.2;
            }
            50% {
                transform: scale(1.1);
                opacity: 0.3;
            }
        }

        /* HEADER */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: transparent;
            backdrop-filter: var(--glass);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            transition: var(--transition);
        }

        .logo:hover {
            transform: scale(1.02);
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background:linear-gradient(135deg, black, white);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            color: white;
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .logo-text {
            display: flex;
            flex-direction: column;
        }

        .logo-text h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background:linear-gradient(135deg, wheat, white);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
            line-height: 1;
        }

        .logo-text span {
            font-size: 0.8rem;
            color: var(--text-secondary);
            font-weight: 400;
            margin-top: 2px;
        }

        /* USER SECTION */
        .user-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .stats {
            display: flex;
            gap: 1rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.5rem 1rem;
            border-radius: 12px;
            backdrop-filter: var(--glass);
            border: 1px solid var(--border);
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 500;
        }

        .stat-item i {
            color: wheat;
            font-size: 0.9rem;
        }

        .stat-value {
            color: var(--text);
            font-weight: 600;
        }

        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, wheat, white);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 1rem;
            color: black;
            border: 2px solid rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.2);
        }

        .user-avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.3);
        }

        /* MAIN CONTENT */
        .main-content {
            margin-top: 80px;
            padding: 2rem;
            max-width: 1600px;
            margin-left: auto;
            margin-right: auto;
        }

        /* HERO SECTION */
        .hero-section {
            text-align: center;
            margin-bottom: 3rem;
            position: relative;
            padding: 2rem;
        }

        .hero-title {
            font-size: 3.5rem;
            font-weight: 800;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, wheat, #ffffff, gold);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            background-size: 200% auto;
            animation: gradientShift 6s ease infinite;
            letter-spacing: -1px;
            line-height: 1.1;
            font-family: 'font';
        }

        @keyframes gradientShift {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .hero-subtitle {
            color: var(--text-secondary);
            font-size: 1.4rem;
            max-width: 700px;
            font-family: Arial;
            margin: 0 auto 2rem;
            line-height: 1.6;
            font-weight: 400;
        }

        .hero-stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
        }

        .hero-stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 1rem 1.5rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            border: 1px solid var(--border);
            min-width: 120px;
        }

        .hero-stat-number {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(135deg, wheat, #ffffff, gold);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        .hero-stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        /* FILTER BAR */
        .filter-bar {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            padding: 1rem;
            background: transparent;
            backdrop-filter: var(--glass);
            border-radius: var(--radius);
            border: 1px solid var(--border);
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 300px;
            position: relative;
        }

        .search-box i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
            font-size: 1rem;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 2.5rem;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            font-size: 0.95rem;
            transition: var(--transition);
        }

        .search-box input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.08);
        }

        .language-selector {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 0.8rem 1rem;
            border-radius: 12px;
            font-size: 0.95rem;
            cursor: pointer;
            backdrop-filter: var(--glass);
            transition: var(--transition);
            min-width: 140px;
        }

        .language-selector:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--primary);
        }

        .language-selector option {
            background: var(--bg-secondary);
            color: var(--text);
        }

        /* PODCASTS GRID */
        .podcasts-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 2rem;
            margin-bottom: 8rem;
        }

        /* PODCAST CARD */
.podcast-card {
    /* Apple Pure Liquid Glass - Enhanced from original */
    background: 
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.25) 0%, transparent 35%),
        radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.2) 0%, transparent 40%),
        linear-gradient(135deg, 
            rgba(248, 250, 252, 0.18),
            rgba(241, 245, 249, 0.12),
            rgba(226, 232, 240, 0.08)
        );
    
    /* Enhanced blur with Apple's liquid saturation */
    backdrop-filter: blur(30px) saturate(200%) brightness(120%);
    -webkit-backdrop-filter: blur(30px) saturate(200%) brightness(120%);
    
    /* Softer, more organic border radius */
    border-radius: 32px;
    overflow: hidden;
    
    /* Liquid glass border */
    border: 1.5px solid rgba(255, 255, 255, 0.28);
    border-top: 1px solid rgba(255, 255, 255, 0.45);
    border-left: 1px solid rgba(255, 255, 255, 0.4);
    
    /* Smooth transitions */
    transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
    position: relative;
    
    /* Apple's premium shadow stack */
    box-shadow: 
        0 15px 35px -10px rgba(15, 23, 42, 0.12),
        0 5px 15px rgba(15, 23, 42, 0.05),
        inset 0 1px 0 rgba(255, 255, 255, 0.4),
        inset 0 -1px 0 rgba(255, 255, 255, 0.1),
        inset 0 8px 12px rgba(255, 255, 255, 0.15);
    
    /* 3D transforms */
    transform-style: preserve-3d;
    perspective: 1200px;
}

/* Liquid glass gradient border - Enhanced */
.podcast-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 32px;
    padding: 1.5px;
    background: radial-gradient(
        circle at 30% 25%,
        rgba(255, 255, 255, 0.6),
        rgba(165, 180, 252, 0.35),
        rgba(196, 181, 253, 0.25),
        rgba(180, 210, 254, 0.3),
        rgba(255, 255, 255, 0.2)
    );
    -webkit-mask: 
        linear-gradient(#fff 0 0) content-box, 
        linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    z-index: 1;
    transition: all 0.5s ease;
    opacity: 0.9;
    pointer-events: none;
}

/* 3D stacked layers with liquid glass effect - Enhanced */
.podcast-card::after {
    content: '';
    position: absolute;
    width: calc(100% - 24px);
    height: 100%;
    background: radial-gradient(
        ellipse at 50% 20%,
        rgba(255, 255, 255, 0.2),
        rgba(241, 245, 249, 0.1),
        rgba(226, 232, 240, 0.05),
        transparent 80%
    );
    border-radius: 32px;
    left: 50%;
    top: -12px;
    transform: translateX(-50%) translateZ(-20px);
    z-index: -1;
    filter: blur(20px);
    opacity: 0.5;
    border: 1px solid rgba(255, 255, 255, 0.15);
    transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
}

/* Card content container - Enhanced */
.podcast-card .card-content {
    position: relative;
    z-index: 3;
    padding: 24px;
}

/* Liquid glass reflection overlay - Enhanced */
.podcast-card .card-content::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 80px;
    background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.4) 0%,
        rgba(255, 255, 255, 0.2) 30%,
        rgba(255, 255, 255, 0.1) 60%,
        transparent 100%
    );
    border-radius: 32px 32px 48px 48px;
    z-index: 2;
    pointer-events: none;
    opacity: 0.9;
    mix-blend-mode: overlay;
}

/* Additional liquid glass top highlight */
.podcast-card .card-content::after {
    content: '';
    position: absolute;
    top: 0;
    left: 10%;
    width: 80%;
    height: 2px;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.5),
        rgba(255, 255, 255, 0.8),
        rgba(255, 255, 255, 0.5),
        transparent
    );
    border-radius: 100%;
    filter: blur(1px);
    opacity: 0.6;
    z-index: 3;
    pointer-events: none;
}

/* Hover effects - Pure liquid glass movement */
.podcast-card:hover {
    transform: translateY(-12px) rotateX(5deg) rotateY(2deg);
    border-color: rgba(255, 255, 255, 0.45);
    border-top-color: rgba(255, 255, 255, 0.6);
    border-left-color: rgba(255, 255, 255, 0.55);
    
    box-shadow: 
        0 30px 55px -15px rgba(15, 23, 42, 0.25),
        0 15px 30px rgba(15, 23, 42, 0.15),
        0 0 50px rgba(165, 180, 252, 0.2),
        inset 0 1px 0 rgba(255, 255, 255, 0.5),
        inset 0 -1px 0 rgba(255, 255, 255, 0.15),
        inset 0 12px 20px rgba(255, 255, 255, 0.2);
}

.podcast-card:hover::before {
    background: radial-gradient(
        circle at 35% 30%,
        rgba(255, 255, 255, 0.8),
        rgba(165, 180, 252, 0.5),
        rgba(196, 181, 253, 0.4),
        rgba(180, 210, 254, 0.45),
        rgba(255, 255, 255, 0.3)
    );
    opacity: 1;
    padding: 2px;
}

.podcast-card:hover::after {
    top: -18px;
    transform: translateX(-50%) translateZ(-35px);
    opacity: 0.7;
    filter: blur(25px);
    background: radial-gradient(
        ellipse at 50% 25%,
        rgba(255, 255, 255, 0.3),
        rgba(196, 181, 253, 0.2),
        rgba(165, 180, 252, 0.15),
        transparent 80%
    );
    width: calc(100% - 20px);
}

/* Hover effect for reflection */
.podcast-card:hover .card-content::before {
    height: 90px;
    background: linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.5) 0%,
        rgba(255, 255, 255, 0.25) 40%,
        rgba(255, 255, 255, 0.12) 70%,
        transparent 100%
    );
    opacity: 1;
}

.podcast-card:hover .card-content::after {
    opacity: 0.9;
    width: 85%;
    left: 7.5%;
    background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.7),
        rgba(255, 255, 255, 1),
        rgba(255, 255, 255, 0.7),
        transparent
    );
}

/* Active state - Pressed liquid effect */
.podcast-card:active {
    transform: translateY(-4px) rotateX(2deg) scale(0.99);
    box-shadow: 
        0 15px 35px -10px rgba(15, 23, 42, 0.2),
        0 8px 20px rgba(15, 23, 42, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.3),
        inset 0 4px 8px rgba(255, 255, 255, 0.15);
    transition: all 0.2s cubic-bezier(0.23, 1, 0.32, 1);
}

/* Dark mode support - Apple style */
@media (prefers-color-scheme: dark) {
    .podcast-card {
        background: 
            radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.2) 0%, transparent 35%),
            radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.15) 0%, transparent 40%),
            linear-gradient(135deg, 
                rgba(248, 250, 252, 0.12),
                rgba(241, 245, 249, 0.08),
                rgba(226, 232, 240, 0.04)
            );
        
        border: 1.5px solid rgba(255, 255, 255, 0.18);
        border-top: 1px solid rgba(255, 255, 255, 0.3);
        border-left: 1px solid rgba(255, 255, 255, 0.25);
        
        box-shadow: 
            0 15px 35px -10px rgba(0, 0, 0, 0.3),
            0 5px 15px rgba(0, 0, 0, 0.2),
            inset 0 1px 0 rgba(255, 255, 255, 0.25),
            inset 0 -1px 0 rgba(255, 255, 255, 0.08),
            inset 0 8px 12px rgba(255, 255, 255, 0.1);
    }
    
    .podcast-card:hover {
        box-shadow: 
            0 30px 55px -15px rgba(0, 0, 0, 0.4),
            0 15px 30px rgba(0, 0, 0, 0.3),
            0 0 50px rgba(165, 180, 252, 0.15),
            inset 0 1px 0 rgba(255, 255, 255, 0.35),
            inset 0 -1px 0 rgba(255, 255, 255, 0.1),
            inset 0 12px 20px rgba(255, 255, 255, 0.15);
    }
}

/* Optional: Liquid shimmer animation */
@keyframes liquid-shine {
    0% {
        opacity: 0.5;
        transform: translateX(-100%) rotate(10deg);
    }
    20% {
        opacity: 0.8;
    }
    80% {
        opacity: 0.8;
    }
    100% {
        opacity: 0.5;
        transform: translateX(200%) rotate(10deg);
    }
}

.podcast-card.liquid-shimmer {
    position: relative;
    overflow: hidden;
}

.podcast-card.liquid-shimmer::before {
    animation: liquid-shine 4s ease-in-out infinite;
}

        /* PODCAST IMAGE */
        .podcast-image {
            width: 100%;
            height: 200px;
            position: relative;
            overflow: hidden;
        }

        .podcast-image img {
            width: 100%;
            height: 100%;
            object-fit: object-fit;
            transition: transform 0.6s ease;
        }

        .podcast-card:hover .podcast-image img {
            transform: scale(1.05);
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(to bottom, 
                rgba(0, 0, 0, 0.4) 0%,
                rgba(0, 0, 0, 0.8) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .podcast-card:hover .play-overlay {
            opacity: 1;
        }

        .play-btn-large {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, wheat, #f8d592, #eedb73);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: black;
            font-size: 1.5rem;
            border: 3px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            transition: var(--transition);
            transform: scale(0.9);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .podcast-card:hover .play-btn-large {
            transform: scale(1);
        }

        /* PODCAST CONTENT */
        .podcast-content {
            padding: 1.5rem;
        }

        .podcast-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }

        .podcast-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: var(--text);
            line-height: 1.4;
            flex: 1;
            margin-right: 1rem;
        }

        .podcast-plays {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            background: rgba(255, 255, 255, 0.05);
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            white-space: nowrap;
        }

        .podcast-plays i {
            color: gold;
            font-size: 0.8rem;
        }

        /* PODCAST DETAILS */
        .podcast-details {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            margin-bottom: 1.5rem;
        }

        .detail-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            font-size: 0.85rem;
        }

        .detail-row i {
            color: gold;
            width: 16px;
            text-align: center;
        }

        .speakers-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            color: black;
            margin-top: 4px;
        }

        .speaker-tag {
            background: linear-gradient(135deg, wheat, #f8d592, #eedb73);
            color: black);
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .book-trained {
            display: inline-block;
            background: linear-gradient(135deg, wheat, #f8d592, #eedb73);
            color: black;
            padding: 0.25rem 0.6rem;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-left: 8px;
        }

        .podcast-description {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
            display: -webkit-box;
            -webkit-line-clamp: 3;

        // ============================================
        // UTILITY FUNCTIONS
        // ============================================
        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        function formatTime(seconds) {
            if (isNaN(seconds) || !seconds) return '0:00';
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function formatDuration(duration) {
            if (!duration) return '0:00';
            if (typeof duration === 'string') {
                const parts = duration.split(':');
                if (parts.length === 2) {
                    return duration;
                }
            }
            return formatTime(duration);
        }

        // ============================================
        // PAGINATED PODCAST LOADING - 2 AT A TIME
        // ============================================
        function loadPodcasts(loadMore = false) {
            if (isLoadingMore) return;
            
            const t = translations[currentLanguage];
            
            if (!loadMore) {
                showLoading();
                allPodcasts = [];
                filteredPodcasts = [];
                lastDocument = null;
                hasMoreData = true;
                isInitialLoad = true;
            }
            
            isLoadingMore = true;
            
            let query = db.collection('podcasts')
                .orderBy('createdAt', 'desc')
                .limit(PAGE_SIZE);
            
            if (loadMore && lastDocument) {
                query = query.startAfter(lastDocument);
            }
            
            query.get().then(snapshot => {
                isLoadingMore = false;
                isInitialLoad = false;
                
                if (snapshot.empty) {
                    hasMoreData = false;
                    if (allPodcasts.length === 0) {
                        showEmptyState();
                    }
                    removeLoadMoreIndicator();
                    return;
                }
                
                lastDocument = snapshot.docs[snapshot.docs.length - 1];
                
                if (snapshot.docs.length < PAGE_SIZE) {
                    hasMoreData = false;
                }
                
                const newPodcasts = [];
                snapshot.forEach(doc => {
                    const podcast = { 
                        id: doc.id, 
                        ...doc.data(),
                        plays: doc.data().plays || 0,
                        speakers: doc.data().speakers || [],
                        bookTrained: doc.data().bookTrained || false,
                        duration: doc.data().duration || "0:00",
                        category: doc.data().category || "General",
                        totalDuration: doc.data().totalDuration || 0,
                        audioUrl: doc.data().audioUrl || '',
                        audioUrlUrdu: doc.data().audioUrlUrdu || '',
                        captionUrl: doc.data().captionUrl || '',
                        captionUrlUrdu: doc.data().captionUrlUrdu || ''
                    };
                    newPodcasts.push(podcast);
                });
                
                allPodcasts = [...allPodcasts, ...newPodcasts];
                
                filterPodcasts();
                updateStats();
                generateWaveformData();
                setupInfiniteScroll();
                
            }).catch(error => {
                console.error('Error loading podcasts:', error);
                isLoadingMore = false;
                isInitialLoad = false;
                if (allPodcasts.length === 0) {
                    showErrorState();
                }
            });
        }

        // ============================================
        // INFINITE SCROLL - SMOOTH WITH 2 PODCASTS
        // ============================================
        function setupInfiniteScroll() {
            const oldListener = window._scrollListener;
            if (oldListener) {
                window.removeEventListener('scroll', oldListener);
            }
            
            const scrollListener = function() {
                if (!hasMoreData || isLoadingMore || isInitialLoad) return;
                
                const scrollPosition = window.innerHeight + window.scrollY;
                const documentHeight = document.documentElement.scrollHeight;
                
                if (scrollPosition >= documentHeight - 500) {
                    loadPodcasts(true);
                }
            };
            
            window._scrollListener = scrollListener;
            window.addEventListener('scroll', scrollListener);
        }

        // ============================================
        // FILTERING
        // ============================================
        function filterPodcasts() {
            const searchTerm = searchInput.value.toLowerCase();
            
            if (!searchTerm) {
                filteredPodcasts = [...allPodcasts];
            } else {
                filteredPodcasts = allPodcasts.filter(podcast => 
                    podcast.title.toLowerCase().includes(searchTerm) ||
                    podcast.description.toLowerCase().includes(searchTerm) ||
                    podcast.category.toLowerCase().includes(searchTerm) ||
                    (podcast.speakers && podcast.speakers.some(speaker => 
                        speaker.toLowerCase().includes(searchTerm)
                    ))
                );
            }
            
            renderPodcasts();
        }

            const container = podcastsContainer;
            removeLoadMoreIndicator();
            
            container.innerHTML = '';
            
            if (filteredPodcasts.length === 0 && allPodcasts.length === 0) {
                showEmptyState();
                return;
            }
            
            if (filteredPodcasts.length === 0 && allPodcasts.length > 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon">
                            <i class="fas fa-search"></i>
                        </div>
                        <h3>No Results Found</h3>
                        <p>Try adjusting your search terms</p>

                return;

            filteredPodcasts.forEach(podcast => {
                const podcastElement = createPodcastElement(podcast);
                container.appendChild(podcastElement);

            if (hasMoreData && allPodcasts.length > 0 && !isInitialLoad) {
                showLoadMoreButton();

            if (allPodcasts.length > 0) {
                const countContainer = document.createElement('div');
                countContainer.style.cssText = `

                    text-align: center;
                    padding: 0.5rem;
                    color: var(--text-tertiary);
                    font-size: 0.8rem;

        // ============================================
        // INITIALIZE PODCAST (Full implementation)
        // ============================================
        function initializePodcast(element, podcast, initialLang) {
            const playBtn = element.querySelector('.play-pause-btn');
            const playOverlay = element.querySelector('.play-btn-large');
            const waveform = element.querySelector('.audio-waveform');
            const currentTimeEl = element.querySelector('.current-time');
            const durationEl = element.querySelector('.duration');
            const progressOverlay = element.querySelector('.progress-overlay');
            const waveformContainer = element.querySelector('.waveform-container');
            const langOptions = element.querySelectorAll('.lang-option');
            const captionsContainer = element.querySelector('.captions-container');
            const captionsToggle = element.querySelector('.captions-toggle');
            const captionText = element.querySelector('.caption-text');

            let audio = null;
            let currentLang = initialLang;
            let captions = null;

            generateWaveformForContainer(waveformContainer, podcast.id);

            function createAudio(lang) {
                const audioUrl = lang === 'ur' && podcast.audioUrlUrdu ? podcast.audioUrlUrdu : podcast.audioUrl;
                
                if (!audioUrl) {
                    playBtn.disabled = true;
                    playOverlay.disabled = true;
                    playBtn.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
                    playOverlay.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
                    return null;
                }

                const newAudio = new Audio(audioUrl);
                newAudio.preload = 'metadata';
                
                newAudio.addEventListener('loadedmetadata', () => {
                    if (durationEl && newAudio.duration && !isNaN(newAudio.duration)) {
                        durationEl.textContent = formatTime(newAudio.duration);
                    }
                });
                
                newAudio.addEventListener('error', (e) => {
                    console.error('Audio error:', e);
                    playBtn.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
                    playOverlay.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
                    playBtn.disabled = true;
                });
                
                newAudio.addEventListener('ended', () => {
                    handleAudioEnd();
                });
                
                return newAudio;
            }

            function getAudio() {
                if (!audio) {
                    audio = createAudio(currentLang);
                }
                return audio;
            }

            function updateProgress() {
                if (audio && audio.duration && !isNaN(audio.duration) && audio === currentAudio) {
                    const percent = (audio.currentTime / audio.duration) * 100;
                    if (progressOverlay) {
                        progressOverlay.style.width = `${percent}%`;
                    }
                    if (currentTimeEl) {
                        currentTimeEl.textContent = formatTime(audio.currentTime);
                    }
                    updateWaveform();
                    
                    if (captionsEnabled && captions) {
                        updateCaptions(audio.currentTime, captions, podcast.id);
                    }
                }
            }

            function updateWaveform() {
                if (!audio || audio !== currentAudio) return;
                
                const percent = (audio.currentTime / audio.duration) * 100;
                const bars = waveformContainer.querySelectorAll('.waveform-bar');
                const activeBars = Math.floor((percent / 100) * bars.length);
                
                bars.forEach((bar, index) => {
                    if (index < activeBars) {
                        bar.classList.add('active');
                    } else {
                        bar.classList.remove('active');
                    }
                });
            }

            function handleWaveformClick(e) {
                const audioElement = getAudio();
                if (!audioElement || !audioElement.duration) return;
                
                const rect = waveform.getBoundingClientRect();
                const clickX = e.clientX - rect.left;
                const width = waveform.clientWidth;
                const percent = Math.max(0, Math.min(1, clickX / width));
                
                audioElement.currentTime = percent * audioElement.duration;
                
                if (progressOverlay) {
                    progressOverlay.style.width = `${percent * 100}%`;
                }
                if (currentTimeEl) {
                    currentTimeEl.textContent = formatTime(audioElement.currentTime);
                }
                updateWaveform();
                
                if (captionsEnabled && captions) {
                    updateCaptions(audioElement.currentTime, captions, podcast.id);
                }
                
                if (audio === currentAudio) {
                    updateMiniPlayer();
                }
            }

            async function loadPodcastCaptions() {
                const captionUrl = currentLang === 'ur' && podcast.audioUrlUrdu ? podcast.captionUrlUrdu : podcast.captionUrl;
                
                if (!captionUrl) {
                    captionText.textContent = 'Captions not available';
                    captionsContainer.classList.add('unavailable');
                    return;
                }
                
                captionText.innerHTML = `
                    <div class="captions-loading">
                        <div class="spinner-small"></div>
                        <span>Loading captions...</span>
                    </div>
                `;
                
                try {
                    captions = await loadCaptions(podcast.id, currentLang);
                    if (captions && captions.length > 0) {
                        if (captionsEnabled) {
                            captionText.textContent = 'Captions ready';
                            captionsContainer.classList.add('active');
                        } else {
                            captionText.textContent = 'Captions available';
                        }
                    } else {
                        captionText.textContent = 'Captions not available';
                        captionsContainer.classList.add('unavailable');
                    }
                } catch (error) {
                    console.error('Failed to load captions:', error);
                    captionText.textContent = 'Failed to load captions';
                    captionsContainer.classList.add('error');
                }
            }

            loadPodcastCaptions();

            function playAudio() {
                const audioElement = getAudio();
                if (!audioElement) return;
                
                if (currentAudio && currentAudio !== audioElement) {
                    stopCurrentAudio();
                }
                
                audioElement.play().then(() => {
                    currentAudio = audioElement;
                    currentPodcast = podcast;
                    currentPodcastElement = element;
                    isPlaying = true;
                    
                    if (captionsEnabled) {
                        loadPodcastCaptions().then(() => {
                            if (captions && captions.length > 0) {
                                updateCaptions(audioElement.currentTime, captions, podcast.id);
                            }
                        });
                    }
                    
                    playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    playOverlay.innerHTML = '<i class="fas fa-pause"></i>';
                    
                    document.querySelectorAll('.play-pause-btn').forEach(btn => {
                        if (btn !== playBtn) {
                            btn.innerHTML = '<i class="fas fa-play"></i>';
                        }
                    });
                    
                    document.querySelectorAll('.play-btn-large').forEach(btn => {
                        if (btn !== playOverlay) {
                            btn.innerHTML = '<i class="fas fa-play"></i>';
                        }
                    });
                    
                    miniPlayBtn.innerHTML = '<i class="fas fa-pause"></i>';
                    
                    miniTrackImage.src = podcast.imageUrl || 'https://images.unsplash.com/photo-1478737270239-2f02b77fc618?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80';
                    miniTrackTitle.textContent = podcast.title;
                    miniTrackArtist.textContent = podcast.speakers?.[0] || 'Void Podcasts';
                    
                    generateMiniWaveform(podcast.id);
                    
                    miniPlayer.classList.add('active');
                    
                    clearInterval(progressInterval);
                    progressInterval = setInterval(() => {
                        updateProgress();
                        updateMiniPlayer();
                    }, 100);
                    
                    updatePlayCount(podcast.id);
                }).catch(error => {
                    console.error('Play error:', error);
                    isPlaying = false;
                });
            }

            function handleAudioEnd() {
                playBtn.innerHTML = '<i class="fas fa-play"></i>';
                playOverlay.innerHTML = '<i class="fas fa-play"></i>';
                miniPlayBtn.innerHTML = '<i class="fas fa-play"></i>';
                
                if (progressOverlay) {
                    progressOverlay.style.width = '0%';
                }
                if (currentTimeEl) {
                    currentTimeEl.textContent = '0:00';
                }
                
                miniPlayer.classList.remove('active');
                
                clearInterval(progressInterval);
                isPlaying = false;
                currentAudio = null;
                currentPodcast = null;
                currentPodcastElement = null;
                
                const bars = waveformContainer.querySelectorAll('.waveform-bar');
                bars.forEach(bar => bar.classList.remove('active'));
                
                updateCaptionDisplay('', podcast.id);
                updateMiniCaptions('');
            }

            function pauseAudio() {
                if (audio) {
                    audio.pause();
                    isPlaying = false;
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    playOverlay.innerHTML = '<i class="fas fa-play"></i>';
                    miniPlayBtn.innerHTML = '<i class="fas fa-play"></i>';
                    clearInterval(progressInterval);
                }
            }

            function togglePlay() {
                if (currentAudio === audio && isPlaying) {
                    pauseAudio();
                } else {
                    playAudio();
                }
            }

            langOptions.forEach(option => {
                option.addEventListener('click', function() {
                    const lang = this.getAttribute('data-lang');
                    
                    if (lang === currentLang && this.classList.contains('active')) return;
                    
                    langOptions.forEach(opt => opt.classList.remove('active'));
                    this.classList.add('active');
                    
                    podcastLanguages[podcast.id] = lang;
                    currentLang = lang;
                    
                    if (currentAudio === audio) {
                        pauseAudio();
                    }
                    
                    if (audio) {
                        audio.pause();
                        audio = null;
                    }
                    audio = createAudio(lang);
                    
                    if (progressOverlay) {
                        progressOverlay.style.width = '0%';
                    }
                    if (currentTimeEl) {
                        currentTimeEl.textContent = '0:00';
                    }
                    if (durationEl) {
                        durationEl.textContent = formatDuration(podcast.duration);
                    }
                    
                    playBtn.innerHTML = '<i class="fas fa-play"></i>';
                    playOverlay.innerHTML = '<i class="fas fa-play"></i>';
                    
                    const bars = waveformContainer.querySelectorAll('.waveform-bar');
                    bars.forEach(bar => bar.classList.remove('active'));
                    
                    loadPodcastCaptions();
                });
            });

            captionsToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                
                captionsEnabled = !captionsEnabled;
                this.classList.toggle('active');
                this.innerHTML = `<i class="fas fa-${captionsEnabled ? 'closed-captioning' : 'text-height'}"></i>`;
                
                localStorage.setItem('void_captions_enabled', captionsEnabled.toString());
                
                if (captionsEnabled) {
                    captionsContainer.classList.add('active');
                    if (captions && captions.length > 0) {
                        captionText.textContent = 'Captions ready';
                        if (currentAudio === audio && audio.currentTime) {
                            updateCaptions(audio.currentTime, captions, podcast.id);
                        }
                    } else {
                        captionText.textContent = 'Loading captions...';
                        loadPodcastCaptions();
                    }
                } else {
                    captionsContainer.classList.remove('active');
                    captionText.textContent = 'Captions available';
                    captionText.classList.remove('active', 'highlight');
                }
                
                if (!captionsEnabled) {
                    updateMiniCaptions('');
                }
            });

            playBtn.addEventListener('click', togglePlay);
            playOverlay.addEventListener('click', togglePlay);
            waveform.addEventListener('click', handleWaveformClick);
        }

        // ============================================
        // CAPTIONS FUNCTIONS
        // ============================================
        function parseSRT(srtText) {
            const captions = [];
            const lines = srtText.split('\n');
            let currentCaption = null;
            
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                
                if (!line) continue;
                
                if (/^\d+$/.test(line)) {
                    if (currentCaption) {
                        captions.push(currentCaption);
                    }
                    currentCaption = { index: parseInt(line), text: '', start: 0, end: 0 };
                }
                else if (line.includes('-->')) {
                    if (currentCaption) {
                        const times = line.split('-->');
                        currentCaption.start = timeToSeconds(times[0].trim());
                        currentCaption.end = timeToSeconds(times[1].trim());
                    }
                }
                else if (currentCaption) {
                    if (currentCaption.text) {
                        currentCaption.text += ' ' + line;
                    } else {
                        currentCaption.text = line;
                    }
                }
            }
            
            if (currentCaption) {
                captions.push(currentCaption);
            }
            
            return captions;
        }

        function timeToSeconds(timeStr) {
            const parts = timeStr.split(':');
            const lastPart = parts[2] ? parts[2].replace(',', '.') : '0';
            return parseInt(parts[0]) * 3600 + 
                   parseInt(parts[1]) * 60 + 
                   parseFloat(lastPart);
        }

        async function loadCaptions(podcastId, language = 'en') {
            try {
                const podcastRef = db.collection('podcasts').doc(podcastId);
                const podcastDoc = await podcastRef.get();
                
                if (!podcastDoc.exists) {
                    throw new Error('Podcast not found');
                }
                
                const podcast = podcastDoc.data();
                const captionUrl = language === 'ur' ? podcast.captionUrlUrdu : podcast.captionUrl;
                
                if (!captionUrl) {
                    return null;
                }
                
                const response = await fetch(captionUrl);
                if (!response.ok) {
                    throw new Error('Failed to fetch captions');
                }
                
                const srtText = await response.text();
                return parseSRT(srtText);
                
            } catch (error) {
                console.error('Error loading captions:', error);
                return null;
            }
        }

        function updateCaptions(currentTime, captions, podcastId) {
            if (!captions || !captionsEnabled) {
                updateCaptionDisplay('', podcastId);
                return;
            }
            
            let currentCaption = '';
            let isHighlighted = false;
            
            for (const caption of captions) {
                if (currentTime >= caption.start && currentTime <= caption.end) {
                    currentCaption = caption.text;
                    isHighlighted = true;
                    break;
                }
            }
            
            updateCaptionDisplay(currentCaption, podcastId, isHighlighted);
            updateMiniCaptions(currentCaption, isHighlighted);
        }

        function updateCaptionDisplay(text, podcastId, highlight = false) {
            const captionElement = document.querySelector(`.caption-text[data-podcast="${podcastId}"]`);
            if (!captionElement) return;
            
            if (text) {
                captionElement.textContent = text;
                captionElement.classList.add('active');
                if (highlight) {
                    captionElement.classList.add('highlight');
                } else {
                    captionElement.classList.remove('highlight');
                }
            } else {
                const container = captionElement.closest('.captions-container');
                const toggle = container.querySelector('.captions-toggle');
                const isEnabled = toggle.classList.contains('active');
                captionElement.textContent = isEnabled ? 'No caption at this time' : 'Captions available';
                captionElement.classList.remove('active', 'highlight');
            }
        }

        function updateMiniCaptions(text, highlight = false) {
            const miniCaptionText = document.getElementById('miniCaptionText');
            if (!miniCaptionText) return;
            
            if (text) {
                miniCaptionText.textContent = text;
                if (highlight) {
                    miniCaptionText.style.color = 'var(--primary)';
                    miniCaptionText.style.fontWeight = '600';
                } else {
                    miniCaptionText.style.color = 'var(--text)';
                    miniCaptionText.style.fontWeight = '400';
                }
            } else {
                miniCaptionText.textContent = '';
            }
        }

        // ============================================
        // WAVEFORM FUNCTIONS
        // ============================================
        function generateWaveformData() {
            allPodcasts.forEach(podcast => {
                if (!waveformData[podcast.id]) {
                    waveformData[podcast.id] = Array.from({length: 40}, () => Math.random() * 0.8 + 0.2);
                }
            });
        }

        function generateWaveformForContainer(container, podcastId) {
            if (!waveformData[podcastId]) {
                waveformData[podcastId] = Array.from({length: 40}, () => Math.random() * 0.8 + 0.2);
            }
            
            const data = waveformData[podcastId];
            container.innerHTML = '';
            
            data.forEach((height, index) => {
                const bar = document.createElement('div');
                bar.className = 'waveform-bar';
                bar.style.height = `${height * 100}%`;
                container.appendChild(bar);
            });
        }

        function generateMiniWaveform(podcastId) {
            if (!waveformData[podcastId]) {
                waveformData[podcastId] = Array.from({length: 40}, () => Math.random() * 0.8 + 0.2);
            }
            
            const data = waveformData[podcastId];
            miniWaveformBars.innerHTML = '';
            
            data.forEach((height, index) => {
                const bar = document.createElement('div');
                bar.className = 'mini-waveform-bar';
                bar.style.height = `${height * 100}%`;
                miniWaveformBars.appendChild(bar);
            });
        }

        // ============================================
        // MINI PLAYER FUNCTIONS
        // ============================================
        function updateMiniPlayer() {
            if (!currentAudio || !currentPodcast) return;
            
            const percent = (currentAudio.currentTime / currentAudio.duration) * 100;
            miniProgress.style.width = `${percent}%`;
            
            const bars = miniWaveformBars.querySelectorAll('.mini-waveform-bar');
            const activeBars = Math.floor((percent / 100) * bars.length);
            
            bars.forEach((bar, index) => {
                if (index < activeBars) {
                    bar.classList.add('active');
                } else {
                    bar.classList.remove('active');
                }
            });
            
            miniTime.textContent = `${formatTime(currentAudio.currentTime)} / ${formatTime(currentAudio.duration)}`;
        }

        function toggleMiniPlayer() {
            if (currentAudio) {
                if (isPlaying) {
                    currentAudio.pause();
                    isPlaying = false;
                    miniPlayBtn.innerHTML = '<i class="fas fa-play"></i>';
                    
                    if (currentPodcastElement) {
                        const playBtn = currentPodcastElement.querySelector('.play-pause-btn');
                        const playOverlay = currentPodcastElement.querySelector('.play-btn-large');
                        if (playBtn) playBtn.innerHTML = '<i class="fas fa-play"></i>';
                        if (playOverlay) playOverlay.innerHTML = '<i class="fas fa-play"></i>';
                    }
                    
                    clearInterval(progressInterval);
                } else {
                    currentAudio.play().then(() => {
                        isPlaying = true;
                        miniPlayBtn.innerHTML = '<i class="fas fa-pause"></i>';
                        
                        if (currentPodcastElement) {
                            const playBtn = currentPodcastElement.querySelector('.play-pause-btn');
                            const playOverlay = currentPodcastElement.querySelector('.play-btn-large');
                            if (playBtn) playBtn.innerHTML = '<i class="fas fa-pause"></i>';
                            if (playOverlay) playOverlay.innerHTML = '<i class="fas fa-pause"></i>';
                        }
                        
                        progressInterval = setInterval(() => {
                            updateMiniPlayer();
                            if (currentPodcastElement) {
                                const waveformContainer = currentPodcastElement.querySelector('.waveform-container');
                                const bars = waveformContainer?.querySelectorAll('.waveform-bar');
                                const progressOverlay = currentPodcastElement.querySelector('.progress-overlay');
                                const currentTimeEl = currentPodcastElement.querySelector('.current-time');
                                
                                if (currentAudio && currentAudio.duration) {
                                    const percent = (currentAudio.currentTime / currentAudio.duration) * 100;
                                    const activeBars = Math.floor((percent / 100) * (bars?.length || 0));
                                    
                                    bars?.forEach((bar, index) => {
                                        if (index < activeBars) {
                                            bar.classList.add('active');
                                        } else {
                                            bar.classList.remove('active');
                                        }
                                    });
                                    
                                    if (progressOverlay) {
                                        progressOverlay.style.width = `${percent}%`;
                                    }
                                    if (currentTimeEl) {
                                        currentTimeEl.textContent = formatTime(currentAudio.currentTime);
                                    }
                                }
                            }
                        }, 100);
                    });
                }
            }
        }

        function handleMiniWaveformClick(e) {
            if (!currentAudio || !currentAudio.duration) return;
            
            const rect = miniWaveform.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const width = miniWaveform.clientWidth;
            const percent = Math.max(0, Math.min(1, clickX / width));
            
            currentAudio.currentTime = percent * currentAudio.duration;
            updateMiniPlayer();
        }

        function closeMiniPlayer() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
                isPlaying = false;
                currentAudio = null;
                currentPodcast = null;
                currentPodcastElement = null;
                miniPlayer.classList.remove('active');
                miniPlayBtn.innerHTML = '<i class="fas fa-play"></i>';
                clearInterval(progressInterval);
                
                if (captionInterval) {
                    clearInterval(captionInterval);
                    captionInterval = null;
                }
                
                const miniCaptions = document.querySelector('.mini-captions');
                if (miniCaptions) {
                    miniCaptions.style.opacity = '0';
                    miniCaptions.style.pointerEvents = 'none';
                }
                
                document.querySelectorAll('.play-pause-btn').forEach(btn => {
                    btn.innerHTML = '<i class="fas fa-play"></i>';
                });
                document.querySelectorAll('.play-btn-large').forEach(btn => {
                    btn.innerHTML = '<i class="fas fa-play"></i>';
                });
                
                document.querySelectorAll('.waveform-bar').forEach(bar => {
                    bar.classList.remove('active');
                });
                document.querySelectorAll('.progress-overlay').forEach(overlay => {
                    overlay.style.width = '0%';
                });
                document.querySelectorAll('.current-time').forEach(el => {
                    el.textContent = '0:00';
                });
                
                document.querySelectorAll('.caption-text').forEach(el => {
                    const container = el.closest('.captions-container');
                    const toggle = container.querySelector('.captions-toggle');
                    const captionsEnabled = toggle.classList.contains('active');
                    
                    if (captionsEnabled) {
                        el.textContent = 'Captions ready';
                    } else {
                        el.textContent = 'Captions available';
                    }
                    el.classList.remove('active', 'highlight');
                    container.classList.remove('active');
                });
            }
        }

        function stopCurrentAudio() {
            if (currentAudio) {
                currentAudio.pause();
                isPlaying = false;
                
                document.querySelectorAll('.play-pause-btn').forEach(btn => {
                    btn.innerHTML = '<i class="fas fa-play"></i>';
                });
                document.querySelectorAll('.play-btn-large').forEach(btn => {
                    btn.innerHTML = '<i class="fas fa-play"></i>';
                });
                
                miniPlayBtn.innerHTML = '<i class="fas fa-play"></i>';
                
                clearInterval(progressInterval);
            }
        }

        // ============================================
        // STATS FUNCTIONS
        // ============================================
        function updateStats() {
            const totalPlaysCount = allPodcasts.reduce((sum, podcast) => sum + (podcast.plays || 0), 0);
            const totalPodcastsCount = allPodcasts.length;
            const totalDuration = allPodcasts.reduce((sum, podcast) => sum + (podcast.totalDuration || 0), 0);
            const totalHours = Math.floor(totalDuration / 3600);
            
            totalPlays.textContent = totalPlaysCount.toLocaleString();
            totalPodcasts.textContent = totalPodcastsCount;
            heroPlays.textContent = totalPlaysCount.toLocaleString();
            heroPodcasts.textContent = totalPodcastsCount;
            heroDuration.textContent = totalHours;
        }

        async function updatePlayCount(podcastId) {
            try {
                const podcastRef = db.collection('podcasts').doc(podcastId);
                const podcastDoc = await podcastRef.get();
                
                if (podcastDoc.exists) {
                    const currentPlays = podcastDoc.data().plays || 0;
                    await podcastRef.update({
                        plays: currentPlays + 1,
                        lastPlayed: new Date().toISOString()
                    });
                    updateStats();
                }
            } catch (error) {
                console.error('Error updating play count:', error);
            }
        }

        // ============================================
        // INITIALIZE APP
        // ============================================
        document.addEventListener('DOMContentLoaded', function() {
            initApp();
        });

        window.addEventListener('beforeunload', () => {
            if (currentAudio) {
                currentAudio.pause();
            }
            clearInterval(progressInterval);
            if (captionInterval) {
                clearInterval(captionInterval);
            }
        });
    </script>
</body>
</html>
