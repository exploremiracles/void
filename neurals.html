    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
            touch-action: none;
            position: fixed;
            width: 100%;
        }
        
        #container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0a0a1a 0%, #000000 100%);
        }
        
        #video {
            display: none;
        }
        
        #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none;
        }
        
        /* ============================================ */
        /* APP NAME - FIXED SPACING */
        /* ============================================ */
        
        #app-name {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 20;
            pointer-events: none;
            padding: env(safe-area-inset-top, 20px) 20px 20px;
            padding-top: max(env(safe-area-inset-top, 20px), 30px);
            text-align: center;
            background: linear-gradient(to bottom, rgba(0,0,0,0.4) 0%, transparent 100%);
        }
        
        .app-title {
            font-size: 42px;
            font-weight: 800;
            letter-spacing: -0.5px;
            color: white;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
            animation: titleFloat 3s ease-in-out infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .app-title-emoji {
            font-size: 46px;
            animation: thumbPulse 2s ease-in-out infinite;
            display: inline-block;
        }
        
        .app-title-text {
            background: linear-gradient(135deg, #ffffff 0%, #a8c8ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .app-subtitle {
            font-size: 12px;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.8);
            text-shadow: 0 2px 10px rgba(0,0,0,0.3);
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-top: 5px;
        }
        
        .app-tagline {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.6);
            margin-top: 3px;
            font-style: italic;
            text-shadow: 0 1px 5px rgba(0,0,0,0.3);
        }
        
        @keyframes titleFloat {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-3px); }
        }
        
        @keyframes thumbPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.08) rotate(-5deg); }
        }
        
        /* Responsive title */
        @media (max-width: 400px) {
            .app-title {
                font-size: 36px;
            }
            .app-title-emoji {
                font-size: 40px;
            }
            .app-subtitle {
                font-size: 11px;
                letter-spacing: 2px;
            }
        }
        
        /* Stats - Fixed Position */
        #stats-bar {
            position: absolute;
            top: calc(env(safe-area-inset-top, 20px) + 10px);
            top: max(env(safe-area-inset-top, 20px), 25px);
            left: 16px;
            right: 16px;
            display: flex;
            justify-content: space-between;
            z-index: 30;
            pointer-events: none;
        }
        
        .stat-chip {
            background: rgba(10, 10, 26, 0.7);
            backdrop-filter: blur(10px);
            color: white;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 600;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        #fps {
            color: #4fc3f7;
            font-family: monospace;
            font-size: 13px;
        }
        
        /* Gesture Indicator - Proper Spacing */
        #gesture-indicator {
            position: absolute;
            top: 150px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 45;
            pointer-events: none;
            width: 90%;
            max-width: 300px;
        }
        
        @media (max-width: 400px) {
            #gesture-indicator {
                top: 130px;
            }
        }
        
        @media (min-width: 600px) {
            #gesture-indicator {
                top: 170px;
            }
        }
        
        .gesture-badge {
            background: rgba(10, 10, 26, 0.85);
            backdrop-filter: blur(12px);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 25px rgba(0,0,0,0.4);
            transform: scale(1);
        }
        
        .gesture-badge.thumb-detected {
            background: rgba(76, 175, 80, 0.9);
            border-color: #66bb6a;
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(76, 175, 80, 0.4);
        }
        
        .gesture-badge.palm-detected {
            background: rgba(33, 150, 243, 0.9);
            border-color: #42a5f5;
            transform: scale(1.05);
            box-shadow: 0 8px 30px rgba(33, 150, 243, 0.4);
        }
        
        .gesture-icon {
            font-size: 24px;
            animation: pulse-gesture 2s infinite;
        }
        
        @keyframes pulse-gesture {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .gesture-text {
            color: white;
            font-size: 14px;
            font-weight: 600;
        }
        
        /* Dictionary Card */
        #dictionary-card {
            position: absolute;
            bottom: 90px;
            left: 16px;
            right: 16px;
            background: rgba(10, 10, 26, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 16px 20px;
            z-index: 40;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            max-height: 130px;
            overflow-y: auto;
            transition: all 0.3s ease;
        }
        
        #dictionary-card.speaking {
            box-shadow: 0 0 0 3px rgba(33, 150, 243, 0.5);
        }
        
        .word-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            margin-bottom: 6px;
            flex-wrap: wrap;
        }
        
        .current-word {
            font-size: 22px;
            font-weight: 700;
            color: white;
        }
        
        .phonetic {
            font-size: 13px;
            color: #a0a0b0;
        }
        
        .part-of-speech {
            background: rgba(79, 195, 247, 0.2);
            color: #4fc3f7;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 11px;
            text-transform: lowercase;
            font-weight: 500;
            border: 1px solid rgba(79, 195, 247, 0.3);
        }
        
        .definition-text {
            font-size: 14px;
            color: #e0e0e8;
            line-height: 1.4;
        }
        
        .example-text {
            font-size: 12px;
            color: #a0a0b0;
            font-style: italic;
            margin-top: 6px;
            padding-top: 6px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .loading-pulse {
            animation: pulse 1.5s infinite;
            color: #a0a0b0;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }
        
        /* Controls */
        #controls {
            position: absolute;
            bottom: 16px;
            bottom: max(16px, env(safe-area-inset-bottom, 16px));
            left: 16px;
            right: 16px;
            display: flex;
            gap: 10px;
            z-index: 50;
            pointer-events: auto;
        }
        
        .btn {
            flex: 1;
            background: rgba(10, 10, 26, 0.85);
            backdrop-filter: blur(15px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        .btn.primary {
            background: rgba(33, 150, 243, 0.9);
            color: white;
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 4px 20px rgba(33, 150, 243, 0.4);
        }
        
        .btn:active {
            transform: scale(0.96);
        }
        
        .btn:disabled {
            opacity: 0.5;
            pointer-events: none;
        }
        
        /* Install Banner */
        #install-banner {
            position: absolute;
            bottom: 90px;
            left: 16px;
            right: 16px;
            background: rgba(10, 10, 26, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 16px;
            z-index: 60;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            display: none;
            animation: slideUp 0.3s ease;
        }
        
        #install-banner.show {
            display: block;
        }
        
        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .install-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        
        .install-icon {
            font-size: 32px;
        }
        
        .install-title {
            font-size: 16px;
            font-weight: 700;
            color: white;
        }
        
        .install-subtitle {
            font-size: 13px;
            color: #a0a0b0;
            margin-top: 2px;
        }
        
        .install-buttons {
            display: flex;
            gap: 10px;
        }
        
        .install-btn {
            flex: 1;
            padding: 12px;
            border-radius: 30px;
            border: none;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        
        .install-btn.primary {
            background: #2196f3;
            color: white;
        }
        
        .install-btn.secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }
        
        /* Loading */
        #loading {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, #0a0a1a 0%, #000000 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
            transition: opacity 0.5s ease;
        }
        
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        
        .loading-logo {
            font-size: 60px;
            margin-bottom: 20px;
            animation: thumbPulse 2s ease-in-out infinite;
        }
        
        .loading-title {
            font-size: 42px;
            font-weight: 800;
            margin-bottom: 10px;
            text-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        
        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px 0;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        .loading-text {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        
        .loading-subtext {
            font-size: 13px;
            opacity: 0.8;
        }
        
        .cache-status {
            margin-top: 20px;
            font-size: 12px;
            opacity: 0.7;
        }
        
        /* Offline Indicator */
        #offline-indicator {
            position: absolute;
            top: calc(env(safe-area-inset-top, 20px) + 10px);
            top: max(env(safe-area-inset-top, 20px), 25px);
            right: 16px;
            z-index: 35;
            background: rgba(10, 10, 26, 0.85);
            backdrop-filter: blur(10px);
            padding: 6px 12px;
            border-radius: 30px;
            font-size: 11px;
            font-weight: 600;
            display: none;
            align-items: center;
            gap: 5px;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        #offline-indicator.show {
            display: flex;
        }
        
        /* iOS Speech Fix Hint */
        #speech-hint {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(33, 150, 243, 0.95);
            color: white;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            z-index: 70;
            display: none;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        
        #speech-hint.show {
            display: block;
            animation: fadeInOut 2s ease;
        }
        
        @keyframes fadeInOut {
            0%, 100% { opacity: 0; transform: translateX(-50%) translateY(10px); }
            20%, 80% { opacity: 1; transform: translateX(-50%) translateY(0); }
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="loading-logo">V 0.1</div>
        <div class="loading-title">Neural S</div>
        <div class="spinner"></div>
        <div class="loading-text" id="loading-message">Loading hand detection...</div>
        <div class="loading-subtext">ML powered learning</div>
        <div class="cache-status" id="cache-status"></div>
    </div>
    
    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="canvas"></canvas>
        
        <!-- APP NAME HEADER -->
        <div id="app-name">
            <div class="app-title">
                <span class="app-title-emoji">V 0.1</span>
                <span class="app-title-text">Neural S</span>
            </div>
            <div class="app-subtitle">ML powered</div>
            <div class="app-tagline">Vocabulary Learning</div>
        </div>
        
        <div id="stats-bar">
            <div class="stat-chip">
                <span>📚</span>
                <span id="word-count">0</span>
            </div>
            <div class="stat-chip">
                <span>⚡</span>
                <span id="fps">0</span> FPS
            </div>
        </div>
        
        <div id="offline-indicator">
            <span>📡</span>
            <span>Offline Mode</span>
        </div>
        
        <div id="gesture-indicator">
            <div class="gesture-badge" id="gesture-badge">
                <span class="gesture-icon" id="gesture-icon">🖐️</span>
                <span class="gesture-text" id="gesture-text">Show 👍 for next word</span>
            </div>
        </div>
        
        <div id="dictionary-card">
            <div class="word-row">
                <span class="current-word" id="current-word">
                    <span class="loading-pulse">Loading...</span>
                </span>
                <span class="phonetic" id="phonetic"></span>
                <span class="part-of-speech" id="part-of-speech"></span>
            </div>
            <div class="definition-text" id="definition"></div>
            <div class="example-text" id="example"></div>
        </div>
        
        <div id="speech-hint">
            <span>🔊 Tap Speak button first to enable voice</span>
        </div>
        
        <div id="install-banner">
            <div class="install-header">
                <span class="install-icon">📱</span>
                <div>
                    <div class="install-title">Install Neural S</div>
                    <div class="install-subtitle">Get the app-like experience</div>
                </div>
            </div>
            <div class="install-buttons">
                <button class="install-btn primary" onclick="installApp()">Install</button>
                <button class="install-btn secondary" onclick="dismissInstall()">Not now</button>
            </div>
        </div>
        
        <div id="controls">
            <button class="btn" onclick="togglePause()">
                <span id="pause-icon">⏸️</span> <span id="pause-text">Pause</span>
            </button>
            <button class="btn primary" onclick="nextWord()">
                <span>⏭️</span> Skip
            </button>
            <button class="btn" id="speak-button" onclick="initializeAndSpeak()">
                <span>🔊</span> Speak
            </button>
        </div>
    </div>

    <script>
        // DOM Elements
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const loadingDiv = document.getElementById('loading');
        const loadingMessage = document.getElementById('loading-message');
        const cacheStatus = document.getElementById('cache-status');
        const currentWordEl = document.getElementById('current-word');
        const phoneticEl = document.getElementById('phonetic');
        const partOfSpeechEl = document.getElementById('part-of-speech');
        const definitionEl = document.getElementById('definition');
        const exampleEl = document.getElementById('example');
        const wordCountEl = document.getElementById('word-count');
        const fpsEl = document.getElementById('fps');
        const gestureBadge = document.getElementById('gesture-badge');
        const gestureIcon = document.getElementById('gesture-icon');
        const gestureText = document.getElementById('gesture-text');
        const pauseIcon = document.getElementById('pause-icon');
        const pauseText = document.getElementById('pause-text');
        const dictionaryCard = document.getElementById('dictionary-card');
        const offlineIndicator = document.getElementById('offline-indicator');
        const speechHint = document.getElementById('speech-hint');
        
        // State
        let model = null;
        let currentStream = null;
        let detectionInterval = null;
        
        // Gesture
        let gestureStabilityCounter = 0;
        let palmStabilityCounter = 0;
        let thumbUpCooldown = false;
        let palmCooldown = false;
        const STABILITY_THRESHOLD = 4;
        
        // Word management
        let currentWord = null;
        let isLoadingWord = false;
        let wordCount = 0;
        let isPaused = false;
        
        // FPS
        let frameCount = 0;
        let fpsTimer = Date.now();
        
        // PWA Install
        let deferredPrompt = null;
        let installDismissed = false;
        
        // Offline detection
        let isOnline = navigator.onLine;
        
        // Speech synthesis - iOS fix
        let speechSynth = window.speechSynthesis;
        let isSpeaking = false;
        let speechInitialized = false;
        let voicesLoaded = false;
        
        // iOS detection
        const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent);
        
        // ============================================
        // iOS SPEECH FIX - Preload voices
        // ============================================
        
        function preloadVoices() {
            return new Promise((resolve) => {
                let voices = speechSynth.getVoices();
                if (voices.length > 0) {
                    voicesLoaded = true;
                    resolve();
                } else {
                    speechSynth.addEventListener('voiceschanged', () => {
                        voicesLoaded = true;
                        resolve();
                    }, { once: true });
                }
            });
        }
        
        // Initialize speech on first user interaction
        function initializeSpeech() {
            if (!speechInitialized) {
                // Create a dummy utterance to initialize speech
                const dummy = new SpeechSynthesisUtterance('');
                dummy.volume = 0;
                dummy.rate = 1;
                speechSynth.speak(dummy);
                speechInitialized = true;
                
                if (isIOS) {
                    speechHint.classList.add('show');
                    setTimeout(() => {
                        speechHint.classList.remove('show');
                    }, 2000);
                }
            }
        }
        
        // ============================================
        // OFFLINE-FIRST CACHING
        // ============================================
        
        async function setupOfflineCache() {
            if ('caches' in window) {
                try {
                    const cache = await caches.open('thumblex-v1');
                    cacheStatus.textContent = '📦 Caching for offline use...';
                    
                    const urlsToCache = [
                        'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js',
                        'https://cdn.jsdelivr.net/npm/@tensorflow-models/handpose@0.0.7/dist/handpose.min.js'
                    ];
                    
                    await cache.addAll(urlsToCache);
                    cacheStatus.textContent = '✅ Ready for offline use';
                    
                    setTimeout(() => {
                        cacheStatus.style.opacity = '0';
                    }, 2000);
                } catch (error) {
                    console.log('Cache setup:', error);
                    cacheStatus.textContent = '⚠️ Caching incomplete';
                }
            }
        }
        
        // ============================================
        // INSTALL PROMPT
        // ============================================
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            if (!installDismissed) {
                setTimeout(() => {
                    document.getElementById('install-banner').classList.add('show');
                }, 3000);
            }
        });
        
        function installApp() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('User accepted install');
                    }
                    deferredPrompt = null;
                });
            } else if (isIOS) {
                alert('To install: tap Share → Add to Home Screen');
            }
            document.getElementById('install-banner').classList.remove('show');
        }
        
        function dismissInstall() {
            installDismissed = true;
            document.getElementById('install-banner').classList.remove('show');
        }
        
        // ============================================
        // OFFLINE DETECTION
        // ============================================
        
        window.addEventListener('online', () => {
            isOnline = true;
            offlineIndicator.classList.remove('show');
        });
        
        window.addEventListener('offline', () => {
            isOnline = false;
            offlineIndicator.classList.add('show');
        });
        
        // ============================================
        // SPEECH SYNTHESIS - iOS Compatible
        // ============================================
        
        async function initializeAndSpeak() {
            // Initialize speech on user interaction
            initializeSpeech();
            
            if (!currentWord) return;
            
            // Cancel any ongoing speech
            speechSynth.cancel();
            
            // Wait for voices if needed
            if (!voicesLoaded) {
                await preloadVoices();
            }
            
            const utterance = new SpeechSynthesisUtterance(currentWord.word);
            utterance.lang = 'en-US';
            utterance.rate = 0.9;
            utterance.pitch = 1;
            utterance.volume = 1;
            
            // Get English voice
            const voices = speechSynth.getVoices();
            const englishVoice = voices.find(v => v.lang.startsWith('en') && v.localService);
            if (englishVoice) {
                utterance.voice = englishVoice;
            }
            
            dictionaryCard.classList.add('speaking');
            gestureBadge.classList.add('palm-detected');
            gestureIcon.textContent = '🔊';
            gestureText.textContent = `Speaking: ${currentWord.word}`;
            
            utterance.onstart = () => {
                isSpeaking = true;
            };
            
            utterance.onend = () => {
                isSpeaking = false;
                dictionaryCard.classList.remove('speaking');
                gestureBadge.classList.remove('palm-detected');
                gestureIcon.textContent = '🖐️';
                gestureText.textContent = 'Show 👍 for next word';
            };
            
            utterance.onerror = (e) => {
                console.log('Speech error:', e);
                isSpeaking = false;
                dictionaryCard.classList.remove('speaking');
                gestureBadge.classList.remove('palm-detected');
                gestureIcon.textContent = '🖐️';
                gestureText.textContent = 'Show 👍 for next word';
                
                // iOS fallback
                if (isIOS) {
                    speechHint.classList.add('show');
                    setTimeout(() => {
                        speechHint.classList.remove('show');
                    }, 2000);
                }
            };
            
            speechSynth.speak(utterance);
        }
        
        function speakWord() {
            initializeAndSpeak();
        }
        
        // ============================================
        // WORD DATABASE
        // ============================================
        
        const curatedWords = [
            { word: 'serendipity', phonetic: '/ˌserənˈdipədē/', pos: 'noun', def: 'The occurrence and development of events by chance in a happy or beneficial way.', ex: 'A fortunate stroke of serendipity brought the couple together.' },
            { word: 'ephemeral', phonetic: '/əˈfem(ə)rəl/', pos: 'adjective', def: 'Lasting for a very short time.', ex: 'Fashions are ephemeral; style is eternal.' },
            { word: 'mellifluous', phonetic: '/məˈliflo͞oəs/', pos: 'adjective', def: '(of a voice or words) Sweet or musical; pleasant to hear.', ex: 'The mellifluous voice of the singer captivated the audience.' },
            { word: 'quintessential', phonetic: '/ˌkwin(t)əˈsen(t)SHəl/', pos: 'adjective', def: 'Representing the most perfect or typical example of a quality or class.', ex: 'He was the quintessential gentleman.' },
            { word: 'ubiquitous', phonetic: '/yo͞oˈbikwədəs/', pos: 'adjective', def: 'Present, appearing, or found everywhere.', ex: 'Smartphones have become ubiquitous in modern society.' },
            { word: 'ambivalent', phonetic: '/amˈbivələnt/', pos: 'adjective', def: 'Having mixed feelings or contradictory ideas about something or someone.', ex: 'She felt ambivalent about her promotion.' },
            { word: 'dichotomy', phonetic: '/dīˈkädəmē/', pos: 'noun', def: 'A division or contrast between two things that are represented as being opposed or entirely different.', ex: 'The dichotomy between good and evil.' },
            { word: 'epiphany', phonetic: '/əˈpifənē/', pos: 'noun', def: 'A moment of sudden and great revelation or realization.', ex: 'He had an epiphany about his career path.' },
            { word: 'facetious', phonetic: '/fəˈsēSHəs/', pos: 'adjective', def: 'Treating serious issues with deliberately inappropriate humor.', ex: 'His facetious remarks angered the committee.' },
            { word: 'grandiloquent', phonetic: '/ɡranˈdiləkwənt/', pos: 'adjective', def: 'Pompous or extravagant in language, style, or manner.', ex: 'The politician\'s grandiloquent speech impressed few.' },
            { word: 'harbinger', phonetic: '/ˈhärbənjər/', pos: 'noun', def: 'A person or thing that announces or signals the approach of another.', ex: 'The robin is a harbinger of spring.' },
            { word: 'idiosyncrasy', phonetic: '/ˌidēəˈsiNGkrəsē/', pos: 'noun', def: 'A mode of behavior or way of thought peculiar to an individual.', ex: 'One of her idiosyncrasies was always wearing mismatched socks.' },
            { word: 'juxtapose', phonetic: '/ˌjəkstəˈpōz/', pos: 'verb', def: 'Place or deal with close together for contrasting effect.', ex: 'The exhibition juxtaposes modern art with classical pieces.' },
            { word: 'kaleidoscope', phonetic: '/kəˈlīdəˌskōp/', pos: 'noun', def: 'A constantly changing pattern or sequence of elements.', ex: 'The city was a kaleidoscope of cultures.' },
            { word: 'lugubrious', phonetic: '/ləˈɡ(y)o͞obrēəs/', pos: 'adjective', def: 'Looking or sounding sad and dismal.', ex: 'His lugubrious expression revealed his disappointment.' },
            { word: 'magnanimous', phonetic: '/maɡˈnanəməs/', pos: 'adjective', def: 'Generous or forgiving, especially toward a rival or less powerful person.', ex: 'She was magnanimous in victory.' },
            { word: 'nefarious', phonetic: '/nəˈferēəs/', pos: 'adjective', def: '(Typically of an action or activity) Wicked or criminal.', ex: 'The nefarious plot was uncovered by detectives.' },
            { word: 'obfuscate', phonetic: '/ˈäbfəˌskāt/', pos: 'verb', def: 'Render obscure, unclear, or unintelligible.', ex: 'The lawyer tried to obfuscate the facts.' },
            { word: 'paradigm', phonetic: '/ˈperəˌdīm/', pos: 'noun', def: 'A typical example or pattern of something; a model.', ex: 'This discovery challenges the existing paradigm.' },
            { word: 'quixotic', phonetic: '/kwikˈsädik/', pos: 'adjective', def: 'Exceedingly idealistic; unrealistic and impractical.', ex: 'His quixotic quest for perfection was admirable but futile.' },
            { word: 'resilient', phonetic: '/rəˈzilyənt/', pos: 'adjective', def: 'Able to withstand or recover quickly from difficult conditions.', ex: 'Children are often remarkably resilient.' },
            { word: 'sycophant', phonetic: '/ˈsikəfənt/', pos: 'noun', def: 'A person who acts obsequiously toward someone important to gain advantage.', ex: 'The sycophants surrounded the celebrity.' },
            { word: 'taciturn', phonetic: '/ˈtasəˌtərn/', pos: 'adjective', def: '(Of a person) Reserved or uncommunicative in speech; saying little.', ex: 'The taciturn farmer preferred solitude.' },
            { word: 'vicarious', phonetic: '/vīˈkerēəs/', pos: 'adjective', def: 'Experienced in the imagination through the feelings or actions of another person.', ex: 'She lived vicariously through her children\'s achievements.' },
            { word: 'wistful', phonetic: '/ˈwis(t)fəl/', pos: 'adjective', def: 'Having or showing a feeling of vague or regretful longing.', ex: 'A wistful smile crossed her face.' },
            { word: 'zenith', phonetic: '/ˈzēniTH/', pos: 'noun', def: 'The time at which something is most powerful or successful.', ex: 'The empire was at its zenith.' }
        ];
        
        async function fetchWordnikWord() {
            if (!isOnline) return null;
            try {
                const response = await fetch('https://api.wordnik.com/v4/words.json/randomWord?hasDictionaryDef=true&minLength=5&maxLength=12&api_key=a2a73e7b926c924fad7001ca3111acd55af2ffabf50eb4ae5');
                if (response.ok) {
                    const data = await response.json();
                    return data.word;
                }
            } catch (e) {}
            return null;
        }
        
        async function fetchDatamuseWord() {
            if (!isOnline) return null;
            try {
                const patterns = ['sp', 'tr', 'cr', 'pr', 'gr', 'fl', 'bl', 'ch', 'sh', 'th'];
                const pattern = patterns[Math.floor(Math.random() * patterns.length)];
                const response = await fetch(`https://api.datamuse.com/words?sp=${pattern}*&max=20`);
                if (response.ok) {
                    const data = await response.json();
                    if (data.length > 0) {
                        return data[Math.floor(Math.random() * data.length)].word;
                    }
                }
            } catch (e) {}
            return null;
        }
        
        async function fetchDefinitionFromAPI(word) {
            if (!isOnline) return null;
            try {
                const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${word}`);
                if (response.ok) {
                    const data = await response.json();
                    if (data && data[0]) {
                        return data[0];
                    }
                }
            } catch (e) {}
            return null;
        }
        
        async function fetchRandomWord() {
            if (isLoadingWord) return;
            isLoadingWord = true;
            
            currentWordEl.innerHTML = '<span class="loading-pulse">Finding word...</span>';
            phoneticEl.textContent = '';
            partOfSpeechEl.textContent = '';
            definitionEl.textContent = 'Searching for an interesting word...';
            exampleEl.textContent = '';
            
            let word = null;
            let wordData = null;
            
            if (isOnline) {
                word = await fetchWordnikWord();
                if (!word) word = await fetchDatamuseWord();
                
                if (word) {
                    const apiData = await fetchDefinitionFromAPI(word);
                    if (apiData) {
                        const meaning = apiData.meanings[0];
                        const definition = meaning.definitions[0];
                        
                        wordData = {
                            word: apiData.word,
                            phonetic: apiData.phonetic || `/${apiData.word}/`,
                            pos: meaning.partOfSpeech,
                            def: definition.definition,
                            ex: definition.example || `"The word '${apiData.word}' in context."`
                        };
                    }
                }
            }
            
            if (!wordData) {
                const randomIndex = Math.floor(Math.random() * curatedWords.length);
                wordData = curatedWords[randomIndex];
            }
            
            displayWordData(wordData);
        }
        
        function displayWordData(data) {
            currentWord = data;
            
            currentWordEl.textContent = data.word;
            phoneticEl.textContent = data.phonetic;
            partOfSpeechEl.textContent = data.pos;
            definitionEl.textContent = data.def;
            exampleEl.textContent = data.ex;
            
            wordCount++;
            wordCountEl.textContent = wordCount;
            
            isLoadingWord = false;
        }
        
        // ============================================
        // GESTURE DETECTION
        // ============================================
        
        function detectThumbsUp(landmarks) {
            if (!landmarks || landmarks.length === 0) return false;
            
            const thumbTip = landmarks[4];
            const thumbMcp = landmarks[2];
            const wrist = landmarks[0];
            const indexMcp = landmarks[5];
            
            const thumbDirX = thumbTip[0] - thumbMcp[0];
            const thumbDirY = thumbTip[1] - thumbMcp[1];
            
            const handSize = Math.abs(wrist[0] - indexMcp[0]) + Math.abs(wrist[1] - indexMcp[1]);
            const normalizedLength = Math.sqrt(thumbDirX * thumbDirX + thumbDirY * thumbDirY) / handSize;
            
            const isPointingUp = thumbDirY < 0 && Math.abs(thumbDirY) > Math.abs(thumbDirX) * 0.8;
            const thumbExtended = normalizedLength > 0.25;
            
            const indexCurled = isFingerCurled(landmarks, 8, 6, 5);
            const middleCurled = isFingerCurled(landmarks, 12, 10, 9);
            const ringCurled = isFingerCurled(landmarks, 16, 14, 13);
            const pinkyCurled = isFingerCurled(landmarks, 20, 18, 17);
            
            const curledCount = [indexCurled, middleCurled, ringCurled, pinkyCurled].filter(Boolean).length;
            
            return isPointingUp && thumbExtended && curledCount >= 2;
        }
        
        function detectOpenPalm(landmarks) {
            if (!landmarks || landmarks.length === 0) return false;
            
            const fingersExtended = [
                !isFingerCurled(landmarks, 8, 6, 5),
                !isFingerCurled(landmarks, 12, 10, 9),
                !isFingerCurled(landmarks, 16, 14, 13),
                !isFingerCurled(landmarks, 20, 18, 17)
            ];
            
            const extendedCount = fingersExtended.filter(Boolean).length;
            return extendedCount >= 4;
        }
        
        function isFingerCurled(landmarks, tipIdx, pipIdx, mcpIdx) {
            const tip = landmarks[tipIdx];
            const pip = landmarks[pipIdx];
            const mcp = landmarks[mcpIdx];
            
            const tipToMcp = Math.sqrt(Math.pow(tip[0] - mcp[0], 2) + Math.pow(tip[1] - mcp[1], 2));
            const fullLength = Math.sqrt(Math.pow(mcp[0] - pip[0], 2) + Math.pow(mcp[1] - pip[1], 2)) * 2.2;
            
            return tipToMcp < fullLength * 0.7;
        }
        
        function onThumbsUpDetected() {
            if (thumbUpCooldown || isLoadingWord || isPaused) return;
            
            gestureStabilityCounter++;
            gestureText.textContent = `Hold... ${gestureStabilityCounter}/${STABILITY_THRESHOLD}`;
            
            if (gestureStabilityCounter >= STABILITY_THRESHOLD) {
                thumbUpCooldown = true;
                
                gestureBadge.classList.add('thumb-detected');
                gestureIcon.textContent = '👍';
                gestureText.textContent = 'Loading...';
                
                fetchRandomWord();
                
                setTimeout(() => {
                    thumbUpCooldown = false;
                    gestureStabilityCounter = 0;
                    
                    gestureBadge.classList.remove('thumb-detected');
                    gestureIcon.textContent = '🖐️';
                    gestureText.textContent = 'Show 👍 for next word';
                }, 2000);
            }
        }
        
        function onOpenPalmDetected() {
            // Only trigger if speech has been initialized by user interaction
            if (palmCooldown || isSpeaking || !currentWord || !speechInitialized) return;
            
            palmStabilityCounter++;
            
            if (palmStabilityCounter >= STABILITY_THRESHOLD) {
                palmCooldown = true;
                speakWord();
                
                setTimeout(() => {
                    palmCooldown = false;
                    palmStabilityCounter = 0;
                }, 3000);
            }
        }
        
        function updateGestureDisplay(landmarks) {
            if (!landmarks) {
                if (!thumbUpCooldown && !palmCooldown) {
                    gestureStabilityCounter = 0;
                    palmStabilityCounter = 0;
                    gestureIcon.textContent = '🖐️';
                    gestureText.textContent = 'Show 👍 for next word';
                }
                return;
            }
            
            const isThumbsUp = detectThumbsUp(landmarks);
            const isOpenPalm = detectOpenPalm(landmarks);
            
            if (!thumbUpCooldown && !palmCooldown) {
                if (isThumbsUp) {
                    gestureIcon.textContent = '👍';
                    gestureText.textContent = `Hold... ${gestureStabilityCounter}/${STABILITY_THRESHOLD}`;
                } else if (isOpenPalm) {
                    gestureIcon.textContent = '🖐️';
                    gestureText.textContent = speechInitialized ? `Open palm detected...` : `Tap Speak to enable voice`;
                } else {
                    gestureStabilityCounter = 0;
                    palmStabilityCounter = 0;
                    gestureIcon.textContent = '🖐️';
                    gestureText.textContent = 'Show 👍 for next word';
                }
            }
        }
        
        // ============================================
        // RENDERING
        // ============================================
        
        function drawHandLandmarks(landmarks) {
            if (!landmarks) return;
            
            ctx.save();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3;
            ctx.shadowColor = '#4fc3f7';
            ctx.shadowBlur = 15;
            
            const connections = [
                [0, 1], [1, 2], [2, 3], [3, 4],
                [0, 5], [5, 6], [6, 7], [7, 8],
                [0, 9], [9, 10], [10, 11], [11, 12],
                [0, 13], [13, 14], [14, 15], [15, 16],
                [0, 17], [17, 18], [18, 19], [19, 20],
                [5, 9], [9, 13], [13, 17]
            ];
            
            connections.forEach(([i, j]) => {
                ctx.beginPath();
                ctx.moveTo(landmarks[i][0], landmarks[i][1]);
                ctx.lineTo(landmarks[j][0], landmarks[j][1]);
                ctx.stroke();
            });
            
            landmarks.forEach((point, i) => {
                ctx.beginPath();
                ctx.arc(point[0], point[1], i === 4 ? 6 : 4, 0, 2 * Math.PI);
                ctx.fillStyle = i === 4 ? '#4CAF50' : '#ffffff';
                ctx.shadowBlur = 20;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.strokeStyle = '#4fc3f7';
                ctx.lineWidth = 2;
                ctx.stroke();
            });
            
            ctx.restore();
        }
        
        // ============================================
        // DETECTION LOOP
        // ============================================
        
        async function detectHands() {
            if (!model || video.readyState !== 4) return;
            
            try {
                const predictions = await model.estimateHands(video);
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                if (predictions.length > 0) {
                    const hand = predictions[0];
                    const landmarks = hand.landmarks;
                    
                    const isThumbsUp = detectThumbsUp(landmarks);
                    const isOpenPalm = detectOpenPalm(landmarks);
                    
                    updateGestureDisplay(landmarks);
                    
                    if (isThumbsUp && !isPaused) {
                        onThumbsUpDetected();
                    }
                    
                    if (isOpenPalm && !isPaused && speechInitialized) {
                        onOpenPalmDetected();
                    }
                    
                    drawHandLandmarks(landmarks);
                } else {
                    updateGestureDisplay(null);
                }
                
            } catch (error) {}
            
            frameCount++;
        }
        
        // ============================================
        // UI CONTROLS
        // ============================================
        
        function togglePause() {
            isPaused = !isPaused;
            pauseIcon.textContent = isPaused ? '▶️' : '⏸️';
            pauseText.textContent = isPaused ? 'Resume' : 'Pause';
        }
        
        function nextWord() {
            if (isLoadingWord || isPaused) return;
            fetchRandomWord();
        }
        
        // ============================================
        // FPS COUNTER
        // ============================================
        
        function updateFPS() {
            const now = Date.now();
            const elapsed = now - fpsTimer;
            
            if (elapsed >= 500) {
                const fps = Math.round((frameCount * 1000) / elapsed);
                fpsEl.textContent = fps;
                frameCount = 0;
                fpsTimer = now;
            }
            
            requestAnimationFrame(updateFPS);
        }
        
        // ============================================
        // INITIALIZATION
        // ============================================
        
        async function init() {
            try {
                await setupOfflineCache();
                await preloadVoices();
                
                loadingMessage.textContent = 'Accessing camera...';
                
                const constraints = {
                    video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 } },
                    audio: false
                };
                
                currentStream = await navigator.mediaDevices.getUserMedia(constraints);
                video.srcObject = currentStream;
                
                await new Promise((resolve) => {
                    video.onloadedmetadata = () => {
                        canvas.width = video.videoWidth;
                        canvas.height = video.videoHeight;
                        resolve();
                    };
                });
                
                await video.play();
                
                loadingMessage.textContent = 'Loading hand model...';
                model = await handpose.load();
                
                detectionInterval = setInterval(detectHands, 100);
                
                await fetchRandomWord();
                requestAnimationFrame(updateFPS);
                
                loadingDiv.classList.add('hidden');
                
                // Show hint for iOS users
                if (isIOS) {
                    setTimeout(() => {
                        speechHint.classList.add('show');
                        setTimeout(() => {
                            speechHint.classList.remove('show');
                        }, 3000);
                    }, 1000);
                }
                
            } catch (error) {
                console.error('Init error:', error);
                loadingMessage.innerHTML = 'Camera access needed! 📷';
                loadingMessage.style.color = '#ff6b6b';
            }
        }
        
        window.togglePause = togglePause;
        window.nextWord = nextWord;
        window.speakWord = speakWord;
        window.initializeAndSpeak = initializeAndSpeak;
        window.installApp = installApp;
        window.dismissInstall = dismissInstall;
        
        window.onload = init;
    </script>
